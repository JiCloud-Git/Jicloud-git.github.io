<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신랑 수트 취향 월드컵 — 이지플랜북</title>
<meta name="description" content="1분 만에 끝나는 신랑 예복 취향 테스트. 16개 수트 스타일 중 당신의 선택이 말해주는 예복 성향을 알려드려요.">
<link rel="icon" href="img/easylogger.png">
<style>
  :root{--bg:#FAF7F0;--ink:#2B2724;--sub:#6E655B;--tan:#8A6F55;--line:#E2D9CA;--yellow:#F6DE79}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Apple SD Gothic Neo","Pretendard",-apple-system,sans-serif;background:var(--bg);color:var(--ink);word-break:keep-all;overflow-wrap:break-word;line-height:1.6;min-height:100vh}
  .wrap{max-width:640px;margin:0 auto;padding:0 24px}
  header{padding:16px 0;border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px}
  .logo img{width:26px;height:26px;border-radius:50%}
  .logo small{font-weight:600;font-size:9.5px;color:var(--tan);display:block;letter-spacing:.06em}
  .stage{padding:26px 0 60px;text-align:center}
  .round{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--tan);border:1px solid var(--tan);border-radius:99px;padding:4px 14px;margin-bottom:10px}
  h1{font-size:clamp(22px,6vw,30px);font-weight:900;line-height:1.3;margin-bottom:6px}
  .q{font-size:13.5px;color:var(--sub);margin-bottom:20px}
  .vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}
  .vs .badge-vs{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:var(--ink);color:#FAF7F0;font-family:"Times New Roman",serif;font-size:12px;letter-spacing:.1em;padding:6px 10px;border-radius:99px;z-index:2;pointer-events:none}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 10px 16px;cursor:pointer;transition:transform .12s, border-color .12s, box-shadow .12s}
  .card:active{transform:scale(.97)}
  .card:hover{border-color:var(--ink);box-shadow:0 10px 26px rgba(43,39,36,.1)}
  .card svg{width:100%;height:auto;display:block}
  .card .cimg{width:100%;aspect-ratio:43/50;background-position:center top;background-size:cover;border-radius:10px;background-color:#EDE6D8}
  .winimg{width:190px;aspect-ratio:43/50;background-position:center top;background-size:cover;border-radius:12px;margin:0 auto 14px}
  .card b{display:block;font-size:13.5px;font-weight:800;margin-top:8px}
  .card span{display:block;font-size:10.5px;color:var(--sub);margin-top:2px}
  .prog{height:4px;background:#EDE6D8;border-radius:99px;margin:22px auto 0;max-width:280px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--tan);border-radius:99px;transition:width .3s}
  /* intro & result */
  .panel{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:30px 22px;text-align:center}
  .type-tag{font-size:11px;font-weight:800;letter-spacing:.22em;color:var(--tan);margin-bottom:8px}
  .type-name{font-size:clamp(24px,6.6vw,32px);font-weight:900;margin-bottom:6px}
  .type-name em{font-style:normal;box-shadow:inset 0 -0.4em 0 var(--yellow)}
  .type-desc{font-size:13.5px;color:#55493E;line-height:1.75;margin-bottom:20px}
  .axes{max-width:360px;margin:0 auto 22px;text-align:left}
  .ax{margin-bottom:10px}
  .ax .lb{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;color:var(--sub);margin-bottom:3px}
  .ax .bar{height:7px;background:#EDE6D8;border-radius:99px;overflow:hidden;display:flex}
  .ax .bar i{display:block;height:100%;background:var(--ink);border-radius:99px 0 0 99px}
  .reco{background:#F3EDE2;border-radius:12px;padding:14px 16px;text-align:left;margin-bottom:22px}
  .reco h4{font-size:11px;letter-spacing:.16em;color:var(--tan);font-weight:800;margin-bottom:6px}
  .reco li{font-size:13px;line-height:1.7;color:#3E362E;list-style:none;padding-left:16px;position:relative}
  .reco li::before{content:"✓";position:absolute;left:0;color:var(--tan);font-weight:900}
  .cta{display:inline-block;background:var(--ink);color:#FAF7F0;font-size:15px;font-weight:800;padding:15px 24px;border-radius:13px;text-decoration:none;width:100%;max-width:340px}
  .cta.y{background:var(--yellow);color:var(--ink)}
  .top3{text-align:left;margin:0 0 22px}
  .top3 h3{font-size:15px;font-weight:900;margin-bottom:10px}
  .titem{display:flex;gap:12px;background:#FDFBF6;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;align-items:stretch}
  .titem .timg{flex:none;width:92px;aspect-ratio:43/55;border-radius:9px;background-position:center top;background-size:cover}
  .titem .tinfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
  .titem .trank{font-size:9.5px;font-weight:800;letter-spacing:.18em;color:var(--tan)}
  .titem b{font-size:14.5px;display:block;margin:1px 0 5px}
  .why{display:flex;flex-wrap:wrap;gap:4px}
  .why span{font-size:10.5px;background:#F3EDE2;border-radius:99px;padding:3px 9px;color:#55493E;font-weight:700}
  .tabbar{display:flex;gap:8px;margin:0 0 14px}
  .tabbar button{flex:1;padding:11px;border:1.5px solid var(--line);border-radius:99px;background:#fff;font-size:13px;font-weight:800;font-family:inherit;color:var(--ink);cursor:pointer}
  .tabbar button.on{background:var(--ink);color:#FAF7F0;border-color:var(--ink)}
  .combonote{font-size:11.5px;color:var(--sub);line-height:1.6;margin:0 0 12px;text-align:left}
  .tonebox{background:#F3EDE2;border-radius:12px;padding:14px;margin-bottom:20px}
  .tonebox h4{font-size:12px;font-weight:900;margin-bottom:8px}
  .tonebox .seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .tonebox button{padding:8px 13px;border:1.5px solid var(--line);border-radius:99px;background:#fff;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;color:var(--ink)}
  .tonebox button.on{background:var(--ink);color:#FAF7F0;border-color:var(--ink)}
  .nameinp{width:100%;max-width:280px;margin:0 auto 14px;display:block;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;text-align:center;background:#FDFBF6}
  .timenote{font-size:10.5px;color:#9A8F80;margin-bottom:16px}
  .sub-act{display:block;margin-top:12px;font-size:12.5px;color:var(--tan);font-weight:700;cursor:pointer;background:none;border:none}
  footer{padding:26px 0 40px;text-align:center;font-size:10.5px;color:#9A8F80;line-height:1.7}
  footer a{color:var(--tan)}
</style>
</head>
<body>
<header><div class="wrap"><div class="logo"><img src="img/easylogger.png" alt=""><div>신랑 수트 취향 월드컵<small>EASYPLANBOOK · AI 스타일 카드</small></div></div></div></header>

<div class="wrap stage" id="app"></div>

<footer class="wrap">
  카드 이미지는 AI로 생성된 스타일 예시입니다 (실제 판매 상품이 아닙니다) · <a href="index.html">이지플랜북 알아보기</a> · <a href="worldcup.html">드레스 월드컵 →</a><br>
  지클라우드스튜디오 · 결과는 참고용 취향 분석입니다
</footer>

<script>
/* ---------- 16 style cards ---------- */
const CARDS=[
 {img:'01', n:'블랙 피크드 턱시도', d:'새틴 라펠 · 보타이 · 정통 격식', p:{tone:'블랙',inner:'보타이',st:'턱시도'}, ax:{C:'D',F:'K',S:'T'}},
 {img:'02', n:'블랙 벨벳 더블', d:'벨벳 광 · 올블랙 타이', p:{tone:'블랙',inner:'타이',st:'더블'}, ax:{C:'D',F:'K',S:'T'}},
 {img:'03', n:'블랙 싱글 + 타이', d:'미니멀 블랙 · 흰 셔츠', p:{tone:'블랙',inner:'타이',st:'싱글'}, ax:{C:'D',F:'K',S:'M'}},
 {img:'04', n:'네이비 싱글 + 버건디 타이', d:'클래식 배색 · 단정함', p:{tone:'네이비',inner:'타이',st:'싱글'}, ax:{C:'D',F:'K',S:'M'}},
 {img:'05', n:'브라운 트위드 + 터틀넥', d:'텍스처 · 웜 무드', p:{tone:'브라운',inner:'터틀넥',st:'텍스처'}, ax:{C:'D',F:'R',S:'T'}},
 {img:'06', n:'다크 글렌체크 더블 + 니트', d:'패턴 레이어드 · 노타이', p:{tone:'차콜',inner:'니트',st:'더블'}, ax:{C:'D',F:'R',S:'T'}},
 {img:'07', n:'올블랙 터틀넥 수트', d:'시크 · 릴랙스 와이드', p:{tone:'블랙',inner:'터틀넥',st:'싱글'}, ax:{C:'D',F:'R',S:'M'}},
 {img:'08', n:'차콜 수트 + 블랙 크루넥', d:'담백한 다크 톤온톤', p:{tone:'차콜',inner:'니트',st:'싱글'}, ax:{C:'D',F:'R',S:'M'}},
 {img:'09', n:'올화이트 스리피스', d:'조끼 · 실버 타이 · 화사한 격식', p:{tone:'화이트',inner:'타이',st:'스리피스'}, ax:{C:'L',F:'K',S:'T'}},
 {img:'10', n:'라이트그레이 글렌체크 스리피스', d:'댄디 · 조끼 포함', p:{tone:'그레이',inner:'타이',st:'스리피스'}, ax:{C:'L',F:'K',S:'T'}},
 {img:'11', n:'크림 싱글 + 토널 타이', d:'부드러운 포멀', p:{tone:'크림',inner:'타이',st:'싱글'}, ax:{C:'L',F:'K',S:'M'}},
 {img:'12', n:'화이트 재킷 + 블랙 팬츠', d:'상하 배색 · 블랙 타이', p:{tone:'화이트',inner:'타이',st:'싱글'}, ax:{C:'L',F:'K',S:'M'}},
 {img:'13', n:'아이보리 더블 + 터틀넥', d:'톤온톤 레이어드', p:{tone:'크림',inner:'터틀넥',st:'더블'}, ax:{C:'L',F:'R',S:'T'}},
 {img:'14', n:'베이지 린넨 텍스처 수트', d:'밴드칼라 · 내추럴 결', p:{tone:'베이지',inner:'밴드칼라',st:'텍스처'}, ax:{C:'L',F:'R',S:'T'}},
 {img:'15', n:'그레이지 오버사이즈 + 흰 티', d:'릴랙스 핏 · 화보 무드', p:{tone:'그레이지',inner:'티셔츠',st:'싱글'}, ax:{C:'L',F:'R',S:'M'}},
 {img:'16', n:'라이트 베이지 + 오픈칼라', d:'노타이 · 자연광 무드', p:{tone:'베이지',inner:'오픈칼라',st:'싱글'}, ax:{C:'L',F:'R',S:'M'}},
];
const TYPES={
 'D-K-T':{name:'클래식 포멀형', desc:'턱시도·더블의 정통 격식 — 계단 홀, 무배경 같은 그래픽한 공간에서 가장 강한 타입이에요.', reco:['벨벳·새틴 트리밍 더블 또는 턱시도 우선','흰 셔츠+블랙 타이 ↔ 올블랙 이너로 두 무드','헤어는 슬릭 백, 광 없는 매트 왁스']},
 'D-K-M':{name:'모던 블랙형', desc:'군더더기 없는 싱글 수트에 타이 하나 — 어떤 드레스 옆에서도 안정적인 미니멀 포멀 타입.', reco:['블랙·네이비 싱글, 라펠은 노치로 담백하게','타이 폭 7~8cm 무광','구두·벨트 블랙으로 통일']},
 'D-R-T':{name:'무드 레이어드형', desc:'트위드·글렌체크의 텍스처에 니트를 받친 레이어드 — 원단의 결로 분위기를 만드는 타입.', reco:['텍스처 재킷+터틀넥/니트 조합 우선','패턴은 한 아이템만 — 나머지는 솔리드','브라운 로퍼로 웜톤 마무리']},
 'D-R-M':{name:'시크 터틀넥형', desc:'올블랙 터틀넥의 절제된 시크 — 흑백 컷과 미러 존에서 빛나는 화보 취향이에요.', reco:['블랙 터틀넥+와이드 슬랙스 기본','재킷 걸치면 세미 수트로 전환','비비드 부케를 유일한 컬러 포인트로']},
 'L-K-T':{name:'라이트 댄디형', desc:'화이트·라이트그레이 스리피스의 화사한 격식 — 조끼까지 갖춘 클래식 댄디 타입.', reco:['올화이트/글렌체크 스리피스 우선 피팅','실버·도트 타이로 포인트','밝은 세트·자연광 존에서 촬영 비중 높이기']},
 'L-K-M':{name:'소프트 클래식형', desc:'크림·화이트 싱글의 부드러운 포멀 — 힘 있는 격식보다 온화한 단정함을 찾는 타입.', reco:['크림 싱글+토널 타이 우선','화이트 재킷+블랙 팬츠 배색도 시도','드레스와 톤온톤으로 묶기']},
 'L-R-T':{name:'아이보리 텍스처형', desc:'린넨·더블의 결이 살아있는 라이트 톤 레이어드 — 내추럴하지만 밋밋하지 않은 타입.', reco:['아이보리 더블+터틀넥, 린넨 텍스처 수트','밴드칼라 셔츠로 목선 정리','자연광·커튼 존과 최고 궁합']},
 'L-R-M':{name:'내추럴 그레이지형', desc:'오버사이즈 그레이지에 흰 티 — 힘을 완전히 뺀 요즘 화보의 정석 타입이에요.', reco:['그레이지 오버사이즈+흰 티/오픈칼라','슬림 핏 금지 — 와이드 슬랙스 필수','헤어 내추럴 다운, 소파·커튼 존 컷 비중↑']},
};
const LB={
 tone:{'블랙':'블랙','네이비':'네이비','차콜':'차콜','브라운':'브라운','화이트':'화이트','그레이':'라이트그레이','크림':'크림','그레이지':'그레이지','베이지':'베이지'},
 inner:{'타이':'타이','보타이':'보타이','티셔츠':'티셔츠','니트':'니트','터틀넥':'터틀넥','오픈칼라':'오픈칼라','밴드칼라':'밴드칼라'},
 st:{'싱글':'싱글','더블':'더블','스리피스':'스리피스','턱시도':'턱시도','텍스처':'텍스처'},
};

/* ---------- state ---------- */
const app=document.getElementById('app');
let deck=[],next=[],round=16,matches=0,tShow=0,userName='';
let axis,attr,cardPts;
function reset(){
  axis={C:{D:0,L:0},F:{K:0,R:0},S:{M:0,T:0}};
  attr={tone:{},inner:{},st:{}};
  cardPts={};
  deck=shuffle([...CARDS]); next=[]; round=16; matches=0;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function bump(c,w){
  axis.C[c.ax.C]+=w; axis.F[c.ax.F]+=w; axis.S[c.ax.S]+=w;
  for(const k of ['tone','inner','st']){ const v=c.p[k]; attr[k][v]=(attr[k][v]||0)+w; }
  cardPts[c.img]=(cardPts[c.img]||0)+w;
}
function roundW(){return round===16?1:round===8?2:round===4?3:5;}

/* ---------- flow ---------- */
function start(){
  CARDS.forEach(c=>{const im=new Image(); im.src='img/cards-suit/'+c.img+'.jpg';});
  userName=(document.getElementById('uname')||{value:''}).value.trim().slice(0,10);
  reset(); render();
}
function pick(i){
  const dt=performance.now()-tShow;               // 고민 시간
  const w=roundW();
  const conf = dt<1500?1.15 : dt<3000?1.0 : dt<5000?0.85 : 0.75;   // 빠를수록 확신
  const loserCredit = dt>=5000?0.5 : dt>=3000?0.3 : 0;             // 오래 고민 = 진 쪽도 좋아함
  const winC=deck[i], loseC=deck[1-i];
  bump(winC, w*conf);
  if(loserCredit) bump(loseC, w*loserCredit);
  next.push(winC); deck.splice(0,2); matches++;
  if(deck.length===0){ if(next.length===1){ result(next[0]); return;} deck=next; next=[]; round=deck.length; }
  render();
}
function render(){
  if(deck.length<2) return;
  const [a,b]=deck; const done=matches, tot=15;
  app.innerHTML=`
   <span class="round">${round===16?'16강':round===8?'8강':round===4?'준결승':'결승'}</span>
   <h1>더 끌리는 수트는?</h1>
   <p class="q">직감으로 골라주세요 — ${done+1} / ${tot}</p>
   <div class="vs">
     <span class="badge-vs">VS</span>
     <div class="card" onclick="pick(0)"><div class="cimg" style="background-image:url('img/cards-suit/${a.img}.jpg')"></div><b>${a.n}</b><span>${a.d}</span></div>
     <div class="card" onclick="pick(1)"><div class="cimg" style="background-image:url('img/cards-suit/${b.img}.jpg')"></div><b>${b.n}</b><span>${b.d}</span></div>
   </div>
   <div class="prog"><i style="width:${done/tot*100}%"></i></div>`;
  window.scrollTo({top:0});
  tShow=performance.now();
}

/* ---------- result ---------- */
function share(dim,key){ const s=Object.values(attr[dim]).reduce((x,y)=>x+y,0); return s? Math.round((attr[dim][key]||0)/s*100):0; }
function topKey(dim){ return Object.entries(attr[dim]).sort((a,b)=>b[1]-a[1])[0]?.[0]; }
function cardScore(c){
  return share('tone',c.p.tone)*1.0 + share('inner',c.p.inner)*0.9 + share('st',c.p.st)*0.7 + (cardPts[c.img]||0)*3;
}
function reasons(c){
  const r=[];
  r.push({t:`${LB.tone[c.p.tone]} 톤 — 선택 비중 ${share('tone',c.p.tone)}%`, v:share('tone',c.p.tone)});
  r.push({t:`이너 ${LB.inner[c.p.inner]} ${share('inner',c.p.inner)}%`, v:share('inner',c.p.inner)});
  r.push({t:`${LB.st[c.p.st]} 구조 ${share('st',c.p.st)}%`, v:share('st',c.p.st)});
  if((cardPts[c.img]||0)>0) r.push({t:'토너먼트에서 직접 선택', v:101});
  return r.sort((a,b)=>b.v-a.v).slice(0,3).map(x=>`<span>${x.t}</span>`).join('');
}
function titem(c,label,why){return `<div class="titem"><div class="timg" style="background-image:url('img/cards-suit/${c.img}.jpg')"></div><div class="tinfo"><span class="trank">${label}</span><b>${c.n}</b><div class="why">${why}</div></div></div>`;}
function swTab(btn,m){document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b===btn));document.getElementById('tab-top').style.display=m==='top'?'':'none';document.getElementById('tab-combo').style.display=m==='combo'?'':'none';}
let profile=null;
function pct(x,y){return Math.round(x/(x+y)*100)||50;}
function result(winner){
  const key=(axis.C.D>=axis.C.L?'D':'L')+'-'+(axis.F.K>=axis.F.R?'K':'R')+'-'+(axis.S.T>=axis.S.M?'T':'M');
  const t=TYPES[key];
  const sp=pct(axis.C.D,axis.C.L), dp=pct(axis.F.K,axis.F.R), mp=pct(axis.S.T,axis.S.M);
  // TOP3: 점수순 + 우승 카드 보장
  let ranked=[...CARDS].sort((a,b)=>cardScore(b)-cardScore(a));
  let top3=ranked.slice(0,3);
  if(!top3.some(c=>c.img===winner.img)){ top3=[winner,...top3.slice(0,2)]; }
  const ranked2=ranked.slice();
  const darkFam=['블랙','네이비','차콜','브라운'];
  const c1=ranked2.find(c=>c.ax.C==='D'&&c.ax.F==='K')||ranked2[0];
  const c2=ranked2.find(c=>c.img!==c1.img)||ranked2[0];
  const c3=ranked2.find(c=>c.img!==c1.img&&c.img!==c2.img&&c.ax.F==='R'&&(darkFam.includes(c.p.tone)!==darkFam.includes(c2.p.tone)))||ranked2.find(c=>c.img!==c1.img&&c.img!==c2.img&&c.ax.F==='R')||ranked2.find(c=>c.img!==c1.img&&c.img!==c2.img);
  const combo=[{c:c1,role:'클래식 포멀 · 스튜디오 기본'},{c:c2,role:'시그니처 · 취향 1순위'},{c:c3,role:'변주 · 캐주얼 컷'}];
  const who=userName?userName+' 님':'예비 신랑님';
  profile={name:userName, type:t.name, tone:null,
    top:top3.map(c=>({name:c.n,img:c.img})),
    combo:combo.map(x=>({name:x.c.n,img:x.c.img,role:x.role})),
    prefs:{톤:`${LB.tone[topKey('tone')]} ${share('tone',topKey('tone'))}%`, 이너:`${LB.inner[topKey('inner')]} ${share('inner',topKey('inner'))}%`, 구조:`${LB.st[topKey('st')]} ${share('st',topKey('st'))}%`}};
  try{localStorage.setItem('epb_groom_type',t.name); localStorage.setItem('epb_groom_profile',JSON.stringify(profile));}catch(e){}
  app.innerHTML=`
   <div class="panel">
    <div class="type-tag">MY SUIT TYPE</div>
    <div class="type-name"><em>${t.name}</em></div>
    <p class="type-desc">${t.desc}</p>
    <p class="timenote">선택 속도(고민한 시간)까지 가중치로 반영한 결과예요</p>
    <div class="axes">
      <div class="ax"><div class="lb"><span>딥 톤</span><span>라이트 톤</span></div><div class="bar"><i style="width:${sp}%"></i></div></div>
      <div class="ax"><div class="lb"><span>포멀</span><span>릴랙스</span></div><div class="bar"><i style="width:${dp}%"></i></div></div>
      <div class="ax"><div class="lb"><span>스트럭처드</span><span>미니멀</span></div><div class="bar"><i style="width:${mp}%"></i></div></div>
    </div>
    <div class="top3">
      <div class="tabbar">
        <button type="button" class="on" onclick="swTab(this,'top')">내 취향 TOP 3</button>
        <button type="button" onclick="swTab(this,'combo')">촬영 조합 추천</button>
      </div>
      <div id="tab-top">
        <h3>${who}과 어울리는 수트는 이 세 벌이에요 🖤</h3>
        ${top3.map((c,i)=>titem(c,i===0?'BEST MATCH':i===1?'SECOND':'THIRD',reasons(c))).join('')}
      </div>
      <div id="tab-combo" style="display:none">
        <h3>실제 촬영은 조합이에요 — 이렇게 배분해 보세요 📸</h3>
        <div class="combonote">스튜디오 촬영은 보통 2~4벌 — 취향과 별개로 <b>클래식 다크 포멀 한 벌은 기본</b>으로 잡는 걸 추천해요. 유료 가이드(플랜북)에선 스튜디오 화보·의상 벌수까지 반영해 존별로 정밀 배분해 드립니다.</div>
        ${combo.map(x=>titem(x.c,x.role,reasons(x.c))).join('')}
      </div>
    </div>
    <div class="tonebox" id="tonebox">
      <h4>보너스 한 문항 — 구두는 어느 쪽? (가이드에 반영돼요)</h4>
      <div class="seg">
        ${['블랙 로퍼','브라운 로퍼','더비·레이스업','모르겠어요'].map(x=>`<button type="button" onclick="setTone(this,'${x}')">${x}</button>`).join('')}
      </div>
    </div>
    <div class="reco"><h4>이 타입의 셀렉 방향</h4><ul>${t.reco.map(r=>`<li>${r}</li>`).join('')}</ul></div>
    <a class="cta y" href="apply.html?edition=couple">우리 스튜디오 기준 촬영 플랜북 받기 — 9,900원</a>
    <button class="sub-act" onclick="shareResult('${t.name}')">결과 복사하기</button>
    <button class="sub-act" onclick="intro()">다시 하기</button>
   </div>`;
  window.scrollTo({top:0});
}
function setTone(btn,v){
  document.querySelectorAll('#tonebox button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  if(profile){profile.tone=v; try{localStorage.setItem('epb_groom_profile',JSON.stringify(profile));}catch(e){}}
}
function shareResult(name){
  const txt=`나의 수트 취향은 "${name}" 💛 — 1분 테스트 해보기: `+location.origin+location.pathname;
  navigator.clipboard.writeText(txt).then(()=>alert('결과가 복사됐어요! 예비 신랑·신부에게 공유해보세요 :)'));
}
function intro(){
  app.innerHTML=`
   <div class="panel">
    <div class="type-tag">EASYPLANBOOK</div>
    <div class="type-name">신랑 수트<br><em>월드컵</em></div>
    <p class="type-desc">16개 수트, 15번의 선택.<br>고민한 시간까지 반영해 예복 성향과<br><b>어울리는 수트 TOP 3</b>를 찾아드려요.</p>
    <input class="nameinp" id="uname" type="text" maxlength="10" placeholder="이름·닉네임 (선택)">
    <a class="cta" href="javascript:start()">시작하기</a>
   </div>`;
}
intro();
</script>
</body>
